<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <defs>
    <radialGradient id="bgGrad2" cx="40%" cy="35%" r="70%">
      <stop offset="0%" style="stop-color:#120a00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="glowGold2" cx="45%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0" />
    </radialGradient>
    <linearGradient id="paddleFaceGrad2" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="edgeGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a227" />
      <stop offset="50%" style="stop-color:#FFD700" />
      <stop offset="100%" style="stop-color:#8B6914" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B6347" />
      <stop offset="50%" style="stop-color:#704f38" />
      <stop offset="100%" style="stop-color:#5a3d28" />
    </linearGradient>
    <linearGradient id="handleGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#111" />
      <stop offset="50%" style="stop-color:#222" />
      <stop offset="100%" style="stop-color:#111" />
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow2">
      <feDropShadow dx="-10" dy="20" stdDeviation="25" flood-color="#FFD700" flood-opacity="0.35"/>
    </filter>
    <filter id="handShadow">
      <feDropShadow dx="5" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.7"/>
    </filter>
    <pattern id="carbon2" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#0d0d0d"/>
      <path d="M0 4 L8 4" stroke="#171717" stroke-width="0.5"/>
      <path d="M4 0 L4 8" stroke="#171717" stroke-width="0.5"/>
      <rect x="0" y="0" width="4" height="4" fill="#111" opacity="0.5"/>
      <rect x="4" y="4" width="4" height="4" fill="#111" opacity="0.5"/>
    </pattern>
  </defs>
  
  <!-- Fondo oscuro premium -->
  <rect width="800" height="1000" fill="url(#bgGrad2)"/>
  
  <!-- Glow ambiental dorado -->
  <ellipse cx="380" cy="420" rx="380" ry="380" fill="url(#glowGold2)" opacity="0.8"/>
  
  <!-- Líneas de luz ambiente sutiles -->
  <line x1="0" y1="300" x2="800" y2="280" stroke="#FFD700" stroke-width="0.3" opacity="0.08"/>
  <line x1="0" y1="600" x2="800" y2="620" stroke="#FFD700" stroke-width="0.3" opacity="0.06"/>
  
  <!-- Partículas -->
  <circle cx="100" cy="100" r="1.5" fill="#FFD700" opacity="0.4"/>
  <circle cx="700" cy="150" r="1" fill="#FFD700" opacity="0.5"/>
  <circle cx="50" cy="600" r="2" fill="#FFD700" opacity="0.3"/>
  <circle cx="760" cy="700" r="1.5" fill="#FFD700" opacity="0.4"/>
  <circle cx="120" cy="850" r="1" fill="#c9a227" opacity="0.5"/>
  <circle cx="680" cy="50" r="1.5" fill="#c9a227" opacity="0.3"/>

  <!-- ============ LA PALETA (inclinada ~15 grados) ============ -->
  <g filter="url(#shadow2)" transform="rotate(-12, 400, 500)">
  
    <!-- Sombra lateral/borde de la paleta -->
    <rect x="215" y="80" width="30" height="440" rx="15" fill="#8B6914" opacity="0.8"/>
    
    <!-- CARA PRINCIPAL de la paleta -->
    <rect x="245" y="80" width="310" height="440" rx="18" fill="url(#paddleFaceGrad2)"/>
    
    <!-- Textura carbon -->
    <rect x="245" y="80" width="310" height="440" rx="18" fill="url(#carbon2)"/>
    
    <!-- Marco dorado exterior -->
    <rect x="245" y="80" width="310" height="440" rx="18" 
          fill="none" stroke="url(#edgeGrad2)" stroke-width="4"/>
    
    <!-- Marco dorado interior decorativo -->
    <rect x="258" y="93" width="284" height="414" rx="14" 
          fill="none" stroke="#c9a227" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Línea media horizontal decorativa -->
    <line x1="258" y1="310" x2="542" y2="310" stroke="#FFD700" stroke-width="1" opacity="0.4"/>
    
    <!-- Zona superior: logo -->
    <!-- Círculo decorativo detrás del logo -->
    <circle cx="400" cy="230" r="80" fill="none" stroke="#FFD700" 
            stroke-width="1.5" opacity="0.3"/>
    <circle cx="400" cy="230" r="65" fill="none" stroke="#c9a227" 
            stroke-width="0.8" opacity="0.4"/>
    
    <!-- Logo PADEL 10 STORE -->
    <text x="400" y="205" font-family="Arial Black, sans-serif" font-size="22" 
          font-weight="900" fill="#FFD700" text-anchor="middle" 
          filter="url(#glow2)" letter-spacing="3">PADEL</text>
    <text x="400" y="255" font-family="Arial Black, sans-serif" font-size="60" 
          font-weight="900" fill="#FFD700" text-anchor="middle"
          filter="url(#glow2)" letter-spacing="-3">10</text>
    <text x="400" y="275" font-family="Arial, sans-serif" font-size="13" 
          font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="6"
          opacity="0.85">STORE</text>
    
    <!-- Zona inferior: agujeros de la paleta -->
    <circle cx="320" cy="370" r="6" fill="#000" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="345" cy="370" r="6" fill="#000" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="370" cy="370" r="6" fill="#000" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="395" cy="370" r="6" fill="#000" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="420" cy="370" r="6" fill="#000" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="445" cy="370" r="6" fill="#000" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="470" cy="370" r="6" fill="#000" stroke="#2a2a2a" stroke-width="1"/>
    
    <circle cx="308" cy="395" r="6" fill="#000" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="333" cy="395" r="6" fill="#000" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="358" cy="395" r="6" fill="#000" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="383" cy="395" r="6" fill="#000" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="408" cy="395" r="6" fill="#000" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="433" cy="395" r="6" fill="#000" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="458" cy="395" r="6" fill="#000" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="483" cy="395" r="6" fill="#000" stroke="#2a2a2a" stroke-width="1"/>
    
    <circle cx="320" cy="420" r="6" fill="#000" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="345" cy="420" r="6" fill="#000" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="370" cy="420" r="6" fill="#000" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="395" cy="420" r="6" fill="#000" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="420" cy="420" r="6" fill="#000" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="445" cy="420" r="6" fill="#000" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="470" cy="420" r="6" fill="#000" stroke="#2a2a2a" stroke-width="1"/>
    
    <!-- Zona de transición paleta-mango -->
    <rect x="340" y="520" width="120" height="30" rx="4" fill="#1a0f00" 
          stroke="#c9a227" stroke-width="1" opacity="0.9"/>
    
    <!-- MANGO -->
    <rect x="345" y="515" width="110" height="220" rx="8" fill="url(#handleGrad2)"
          stroke="#c9a227" stroke-width="1.5"/>
    
    <!-- Grip lines -->
    <line x1="348" y1="545" x2="452" y2="545" stroke="#c9a227" stroke-width="2" opacity="0.5"/>
    <line x1="348" y1="562" x2="452" y2="562" stroke="#c9a227" stroke-width="2" opacity="0.5"/>
    <line x1="348" y1="579" x2="452" y2="579" stroke="#c9a227" stroke-width="2" opacity="0.5"/>
    <line x1="348" y1="596" x2="452" y2="596" stroke="#c9a227" stroke-width="2" opacity="0.5"/>
    <line x1="348" y1="613" x2="452" y2="613" stroke="#c9a227" stroke-width="2" opacity="0.5"/>
    <line x1="348" y1="630" x2="452" y2="630" stroke="#c9a227" stroke-width="2" opacity="0.5"/>
    <line x1="348" y1="647" x2="452" y2="647" stroke="#c9a227" stroke-width="2" opacity="0.5"/>
    <line x1="348" y1="664" x2="452" y2="664" stroke="#c9a227" stroke-width="2" opacity="0.5"/>
    <line x1="348" y1="681" x2="452" y2="681" stroke="#c9a227" stroke-width="2" opacity="0.5"/>
    
    <!-- Butt cap dorado -->
    <rect x="335" y="728" width="130" height="22" rx="10" fill="#FFD700"/>
    <text x="400" y="743" font-family="Arial, sans-serif" font-size="9" 
          font-weight="700" fill="#000" text-anchor="middle" letter-spacing="4">P10S</text>
  </g>
  
  <!-- ============ MANO AGARRANDO EL MANGO (encima de la paleta) ============ -->
  <g filter="url(#handShadow)" transform="rotate(-12, 400, 620)">
    
    <!-- Palma de la mano -->
    <ellipse cx="400" cy="660" rx="75" ry="55" fill="url(#skinGrad)"/>
    
    <!-- Dedo índice -->
    <rect x="438" y="580" width="26" height="95" rx="13" fill="url(#skinGrad)"/>
    <!-- articulación índice -->
    <ellipse cx="451" cy="595" rx="13" ry="8" fill="#6a4030"/>
    
    <!-- Dedo medio -->
    <rect x="406" y="568" width="26" height="100" rx="13" fill="url(#skinGrad)"/>
    <!-- articulación medio -->
    <ellipse cx="419" cy="582" rx="13" ry="8" fill="#6a4030"/>
    
    <!-- Dedo anular -->
    <rect x="375" y="572" width="26" height="98" rx="13" fill="url(#skinGrad)"/>
    <!-- articulación anular -->
    <ellipse cx="388" cy="586" rx="13" ry="8" fill="#6a4030"/>
    
    <!-- Dedo meñique -->
    <rect x="346" y="582" width="23" height="88" rx="11.5" fill="url(#skinGrad)"/>
    <!-- articulación meñique -->
    <ellipse cx="357" cy="596" rx="11.5" ry="7" fill="#6a4030"/>
    
    <!-- Pulgar (viene del otro lado) -->
    <ellipse cx="445" cy="688" rx="20" ry="38" fill="url(#skinGrad)" transform="rotate(25, 445, 688)"/>
    
    <!-- Palma detalle -->
    <ellipse cx="400" cy="665" rx="65" ry="48" fill="#7a5540" opacity="0.4"/>
    
    <!-- Uñas sugeridas -->
    <ellipse cx="451" cy="582" rx="8" ry="5" fill="#c4956a" opacity="0.7"/>
    <ellipse cx="419" cy="570" rx="8" ry="5" fill="#c4956a" opacity="0.7"/>
    <ellipse cx="388" cy="574" rx="8" ry="5" fill="#c4956a" opacity="0.7"/>
    <ellipse cx="358" cy="584" rx="7" ry="4.5" fill="#c4956a" opacity="0.7"/>
  </g>
  
  <!-- ============ REFLEXIÓN EN EL SUELO ============ -->
  <ellipse cx="390" cy="910" rx="200" ry="18" fill="#FFD700" opacity="0.08"/>
  <rect x="200" y="905" width="390" height="3" rx="1.5" fill="#FFD700" opacity="0.12"/>
  
  <!-- ============ BRANDING ============ -->
  <text x="400" y="960" font-family="Arial Black, sans-serif" font-size="12" 
        fill="#FFD700" text-anchor="middle" letter-spacing="6" opacity="0.45">PADEL 10 STORE</text>
  <line x1="300" y1="968" x2="500" y2="968" stroke="#FFD700" stroke-width="0.5" opacity="0.25"/>
  
  <!-- Tagline -->
  <text x="400" y="985" font-family="Arial, sans-serif" font-size="9" 
        fill="#ffffff" text-anchor="middle" letter-spacing="4" opacity="0.3">TODO PARA JUGAR AL PÁDEL</text>
</svg>
